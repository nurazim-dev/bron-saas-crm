services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set strong password}
      POSTGRES_DB: zapis
    volumes:
      - zapis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zapis -d zapis']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      WORKER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker/index.js']
    env_file:
      - ./backend/.env.production
    environment:
      WORKER_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  zapis_pgdata:
