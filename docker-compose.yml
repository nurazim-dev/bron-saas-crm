services:
  postgres:
    image: postgres:17-alpine
    container_name: zapis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapis
      POSTGRES_PASSWORD: zapis
      POSTGRES_DB: zapis
    ports:
      - '5432:5432'
    volumes:
      - zapis_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zapis -d zapis']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zapis_pgdata:
