<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Поток данных и архитектура записи Zapis.kg">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1C"/>
      <stop offset="100%" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0E1728"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <style>
      .font-sans {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 1.4s linear infinite;
      }
      .dot-pulse {
        animation: nodePulse 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="16" fill="url(#flowBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="600" y="38" text-anchor="middle" class="font-sans" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="2">ПОТОК ДАННЫХ И АРХИТЕКТУРА ЗАПИСИ</text>
  <line x1="430" y1="50" x2="770" y2="50" stroke="url(#accentGrad)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Connectors with animated dashes and traveling packets -->
  <!-- 1 -> 2 (x: 222 to 264, y: 136) -->
  <line x1="222" y1="136" x2="262" y2="136" stroke="#334155" stroke-width="2.5"/>
  <line class="flow-line" x1="222" y1="136" x2="262" y2="136" stroke="#34D399" stroke-width="2.5"/>
  <polygon points="258,131 266,136 258,141" fill="#34D399"/>
  <circle cy="136" r="4" fill="#6EE7B7">
    <animate attributeName="cx" values="222;262" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 2 -> 3 (x: 454 to 496, y: 136) -->
  <line x1="454" y1="136" x2="494" y2="136" stroke="#334155" stroke-width="2.5"/>
  <line class="flow-line" x1="454" y1="136" x2="494" y2="136" stroke="#22D3EE" stroke-width="2.5"/>
  <polygon points="490,131 498,136 490,141" fill="#22D3EE"/>
  <circle cy="136" r="4" fill="#67E8F9">
    <animate attributeName="cx" values="454;494" dur="1.6s" begin="0.35s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.35s" repeatCount="indefinite"/>
  </circle>

  <!-- 3 -> 4 (x: 686 to 728, y: 136) -->
  <line x1="686" y1="136" x2="726" y2="136" stroke="#334155" stroke-width="2.5"/>
  <line class="flow-line" x1="686" y1="136" x2="726" y2="136" stroke="#60A5FA" stroke-width="2.5"/>
  <polygon points="722,131 730,136 722,141" fill="#60A5FA"/>
  <circle cy="136" r="4" fill="#93C5FD">
    <animate attributeName="cx" values="686;726" dur="1.6s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- 4 -> 5 (x: 918 to 960, y: 136) -->
  <line x1="918" y1="136" x2="958" y2="136" stroke="#334155" stroke-width="2.5"/>
  <line class="flow-line" x1="918" y1="136" x2="958" y2="136" stroke="#A78BFA" stroke-width="2.5"/>
  <polygon points="954,131 962,136 954,141" fill="#A78BFA"/>
  <circle cy="136" r="4" fill="#C4B5FD">
    <animate attributeName="cx" values="918;958" dur="1.6s" begin="1.05s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="1.05s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Web & PWA -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="190" height="116" rx="14" fill="url(#nodeBg)" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#10B981" fill-opacity="0.7"/>
    <circle class="dot-pulse" cx="20" cy="26" r="4.5" fill="#34D399"/>
    <text x="32" y="30" class="font-sans" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="0.8">FRONTEND</text>
    <text x="20" y="58" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700">Web &amp; PWA</text>
    <text x="20" y="80" class="font-sans" fill="#CBD5E1" font-size="12.5">Next.js 16 · React 19</text>
    <text x="20" y="100" class="font-sans" fill="#64748B" font-size="11.5">RU · KY · EN · Dark Mode</text>
  </g>

  <!-- Node 2: REST API v1 -->
  <g transform="translate(264, 78)">
    <rect x="0" y="0" width="190" height="116" rx="14" fill="url(#nodeBg)" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#06B6D4" fill-opacity="0.7"/>
    <circle class="dot-pulse" cx="20" cy="26" r="4.5" fill="#22D3EE"/>
    <text x="32" y="30" class="font-sans" fill="#67E8F9" font-size="11" font-weight="700" letter-spacing="0.8">BACKEND</text>
    <text x="20" y="58" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700">REST API v1</text>
    <text x="20" y="80" class="font-sans" fill="#CBD5E1" font-size="12.5">Express 5 · Zod</text>
    <text x="20" y="100" class="font-sans" fill="#64748B" font-size="11.5">JWT · CSRF · RateLimit</text>
  </g>

  <!-- Node 3: PostgreSQL 17 -->
  <g transform="translate(496, 78)">
    <rect x="0" y="0" width="190" height="116" rx="14" fill="url(#nodeBg)" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#3B82F6" fill-opacity="0.7"/>
    <circle class="dot-pulse" cx="20" cy="26" r="4.5" fill="#60A5FA"/>
    <text x="32" y="30" class="font-sans" fill="#93C5FD" font-size="11" font-weight="700" letter-spacing="0.8">DATABASE</text>
    <text x="20" y="58" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700">PostgreSQL 17</text>
    <text x="20" y="80" class="font-sans" fill="#CBD5E1" font-size="12.5">Prisma 7 · 27 Migrations</text>
    <text x="20" y="100" class="font-sans" fill="#64748B" font-size="11.5">GiST Exclusion Lock</text>
  </g>

  <!-- Node 4: Outbox Worker -->
  <g transform="translate(728, 78)">
    <rect x="0" y="0" width="190" height="116" rx="14" fill="url(#nodeBg)" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#6366F1" fill-opacity="0.7"/>
    <circle class="dot-pulse" cx="20" cy="26" r="4.5" fill="#818CF8"/>
    <text x="32" y="30" class="font-sans" fill="#A5B4FC" font-size="11" font-weight="700" letter-spacing="0.8">ASYNC WORKER</text>
    <text x="20" y="58" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700">Outbox Worker</text>
    <text x="20" y="80" class="font-sans" fill="#CBD5E1" font-size="12.5">Transactional Queue</text>
    <text x="20" y="100" class="font-sans" fill="#64748B" font-size="11.5">Retry &amp; Backoff</text>
  </g>

  <!-- Node 5: Уведомления -->
  <g transform="translate(960, 78)">
    <rect x="0" y="0" width="208" height="116" rx="14" fill="url(#nodeBg)" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#8B5CF6" fill-opacity="0.7"/>
    <circle class="dot-pulse" cx="20" cy="26" r="4.5" fill="#A78BFA"/>
    <text x="32" y="30" class="font-sans" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="0.8">DELIVERY</text>
    <text x="20" y="58" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700">Уведомления</text>
    <text x="20" y="80" class="font-sans" fill="#CBD5E1" font-size="12.5">Smart Telegram Bot</text>
    <text x="20" y="100" class="font-sans" fill="#64748B" font-size="11.5">Email · 24ч / 2ч авто-пуши</text>
  </g>
</svg>
