<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-label="Zapis.kg — Создано для барбершопов и салонов красоты Кыргызстана">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090F1C"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090F1C"/>
    </linearGradient>
    <linearGradient id="waveEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="100" rx="16"/>
    </clipPath>
    <style>
      .font-sans {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes waveShift1 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-80px); }
      }
      @keyframes waveShift2 {
        0%, 100% { transform: translateX(-60px); }
        50% { transform: translateX(20px); }
      }
      .wave-1 { animation: waveShift1 9s ease-in-out infinite; }
      .wave-2 { animation: waveShift2 12s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="1200" height="100" fill="url(#footerBg)"/>

    <path class="wave-1" d="M -120 62 C 120 26, 360 90, 600 56 C 840 22, 1080 84, 1360 48 L 1360 110 L -120 110 Z" fill="url(#waveEmerald)"/>
    <path class="wave-2" d="M -140 72 C 140 94, 380 34, 660 66 C 940 96, 1140 42, 1400 66 L 1400 110 L -140 110 Z" fill="url(#waveCyan)"/>

    <text x="600" y="47" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="0.2">Zapis.kg — Создано для барбершопов и салонов красоты Кыргызстана</text>
    <text x="600" y="70" text-anchor="middle" class="font-sans" fill="#94A3B8" font-size="12" font-weight="500">Multi-Tenant SaaS · PostgreSQL GiST Lock · Smart Telegram Bot · OWASP Top 10:2025 Verified</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="98.5" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
